<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>碎片咖啡</title>
<style>
  body { background: #0a0a0f; color: #f0e6d3; font-family: 'SimSun','STSong','Noto Serif SC',serif; margin:0; }
  #boot-error { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#ff4466; font-size:16px; text-align:center; padding:20px; z-index:9999; background:#0a0a0f; max-width:90%; word-break:break-all; }
  /* 微信/QQ内置浏览器提示 */
  #wechat-tip { display:none; position:fixed; top:0; left:0; width:100%; z-index:10000; background:#1a1020; border-bottom:2px solid #c8a882; padding:14px 16px; text-align:center; color:#f0c070; font-size:15px; line-height:1.6; }
  #wechat-tip span { color:#ffd700; font-weight:bold; }
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="wechat-tip">
  ✨ 请点击右上角 <span>···</span> → 选择 <span>在浏览器中打开</span> ✨
</div>

<div id="boot-error"></div>

<div id="crt-overlay"></div>
<div id="scanlines"></div>

<div id="game-container">
  <!-- 顶部状态栏 -->
  <div id="top-bar">
    <div class="stat" id="stat-day">
      <span class="stat-icon">📅</span>
      <span class="stat-label">第</span><span id="day-num">1</span><span class="stat-label">天</span>
    </div>
    <div class="stat" id="stat-money">
      <span class="stat-icon">💰</span>
      <span id="money-num">500</span>
    </div>
    <div class="stat" id="stat-rep">
      <span class="stat-icon">⭐</span>
      <span class="stat-label">口碑</span><span id="rep-num">0</span>
    </div>
  </div>

  <!-- 好感度条 -->
  <div id="affection-bar">
    <div class="aff-slot" id="aff-luli">
      <span class="aff-name">陆离</span>
      <div class="aff-meter"><div class="aff-fill" style="width:0%"></div></div>
      <span class="aff-val">0</span>
    </div>
    <div class="aff-slot" id="aff-minglang">
      <span class="aff-name">明朗</span>
      <div class="aff-meter"><div class="aff-fill" style="width:0%"></div></div>
      <span class="aff-val">0</span>
    </div>
    <div class="aff-slot" id="aff-xiaomo">
      <span class="aff-name">萧默</span>
      <div class="aff-meter"><div class="aff-fill" style="width:0%"></div></div>
      <span class="aff-val">0</span>
    </div>
  </div>

  <!-- 主画面区 -->
  <div id="scene-area">
    <div id="scene-bg" class="scene-intro"></div>
    <div id="character-display"></div>
    <div id="meta-glitch" class="hidden"></div>
  </div>

  <!-- 对话区 -->
  <div id="dialogue-box">
    <div id="speaker-name"></div>
    <div id="dialogue-text"></div>
    <div id="dialogue-indicator">▼</div>
  </div>

  <!-- 选项区 -->
  <div id="choices-container"></div>
</div>

<!-- 底部操作栏 -->
<div id="bottom-bar">
  <button id="btn-save" title="存档"><span class="btn-icon">💾</span><span class="btn-label">存档</span></button>
  <button id="btn-load" title="读档"><span class="btn-icon">📂</span><span class="btn-label">读档</span></button>
  <button id="btn-auto" title="自动"><span class="btn-icon">▶</span><span class="btn-label">自动</span></button>
  <button id="btn-skip" title="快进"><span class="btn-icon">⏩</span><span class="btn-label">快进</span></button>
  <button id="btn-log" title="回顾"><span class="btn-icon">📜</span><span class="btn-label">日志</span></button>
  <button id="btn-bgm" title="音乐"><span class="btn-icon">🎵</span><span class="btn-label">音乐</span></button>
  <button id="btn-help" title="帮助"><span class="btn-icon">❓</span><span class="btn-label">帮助</span></button>
  <button id="btn-menu" title="菜单"><span class="btn-icon">⚙</span><span class="btn-label">菜单</span></button>
</div>

<!-- ====== 暂停菜单 ====== -->
<div id="pause-overlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-title">— 暂停 —</div>
    <button class="modal-btn" id="pause-continue">继续游戏</button>
    <button class="modal-btn" id="pause-save">保存存档</button>
    <button class="modal-btn" id="pause-load">读取存档</button>
    <button class="modal-btn" id="pause-settings">系统设置</button>
    <button class="modal-btn gacha-btn" id="pause-gacha">🔮 扭蛋抽签</button>
    <button class="modal-btn shop-btn" id="pause-shop">🛒 设备商店</button>
    <button class="modal-btn" id="pause-gallery">🖼 CG画廊</button>
    <button class="modal-btn shop-btn" id="pause-mgmt">☕ 经营管理</button>
    <button class="modal-btn modal-btn-danger" id="pause-exit">返回标题</button>
  </div>
</div>

<!-- ====== 存档菜单 ====== -->
<div id="save-overlay" class="overlay hidden">
  <div class="modal modal-wide">
    <div class="modal-title" id="save-title">— 保存 —</div>
    <div class="save-slots" id="save-slots"></div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-sm" id="save-back">返回</button>
    </div>
  </div>
</div>

<!-- ====== 设置面板 ====== -->
<div id="settings-overlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-title">— 设置 —</div>
    <div class="setting-row">
      <span class="setting-label">文字速度</span>
      <input type="range" id="setting-speed" min="10" max="60" value="30" step="5">
      <span class="setting-val" id="setting-speed-val">30</span>
    </div>
    <div class="setting-row">
      <span class="setting-label">自动播放间隔</span>
      <input type="range" id="setting-auto-delay" min="500" max="4000" value="1500" step="250">
      <span class="setting-val" id="setting-auto-delay-val">1.5s</span>
    </div>
    <div class="setting-row">
      <span class="setting-label">快进速度</span>
      <input type="range" id="setting-skip-speed" min="10" max="100" value="50" step="10">
      <span class="setting-val" id="setting-skip-speed-val">50</span>
    </div>
    <div class="setting-row">
      <span class="setting-label">BGM音量</span>
      <input type="range" id="setting-bgm" min="0" max="100" value="35" step="5">
      <span class="setting-val" id="setting-bgm-val">35%</span>
    </div>
    <div class="setting-row">
      <span class="setting-label">音效音量</span>
      <input type="range" id="setting-sfx" min="0" max="100" value="30" step="5">
      <span class="setting-val" id="setting-sfx-val">30%</span>
    </div>
    <div class="setting-row">
      <span class="setting-label">画面特效</span>
      <label class="switch"><input type="checkbox" id="setting-effects" checked><span class="slider"></span></label>
    </div>
    <button class="modal-btn" id="settings-back">返回</button>
  </div>
</div>

<!-- ====== 对话日志 ====== -->
<div id="log-overlay" class="overlay hidden">
  <div class="modal modal-wide">
    <div class="modal-title">— 对话记录 —</div>
    <div class="log-list" id="log-list"></div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-sm" id="log-back">关闭</button>
    </div>
  </div>
</div>

<!-- ====== Meta 反应弹出 ====== -->
<div id="meta-reaction" class="meta-reaction hidden">
  <span id="meta-reaction-text"></span>
</div>

<!-- ====== 角色画面点击提示 ====== -->
<div id="char-touch-indicator" class="hidden"></div>

<!-- ====== CG 全屏查看器 ====== -->
<div id="cg-viewer" onclick="if(ui)ui.closeCGViewer()">
  <img id="cg-viewer-img" src="" alt="">
  <div class="cg-viewer-title" id="cg-viewer-title"></div>
</div>

<!-- ====== 新手引导 ====== -->
<div id="tutorial-overlay" class="overlay hidden">
  <div class="modal tutorial-modal">
    <div class="modal-title" id="tutorial-title"></div>
    <div class="tutorial-body" id="tutorial-body"></div>
    <div class="tutorial-dots" id="tutorial-dots"></div>
    <div class="tutorial-btns">
      <button class="modal-btn modal-btn-sm" id="tutorial-prev" style="display:none">← 上一步</button>
      <button class="modal-btn modal-btn-sm" id="tutorial-next">下一步 →</button>
      <button class="modal-btn modal-btn-sm" id="tutorial-skip" style="display:none">跳过教程</button>
    </div>
  </div>
</div>

<!-- ====== 扭蛋抽签 ====== -->
<div id="gacha-overlay" class="overlay hidden">
  <div class="modal">
    <div class="modal-title">🔮 扭蛋抽签</div>
    <div style="text-align:center;color:var(--text-dim);margin-bottom:12px;font-size:13px;">200💰 抽一次，获得专属剧情+好感度！</div>
    <button class="modal-btn gacha-btn" data-pool="luli">🌙 陆离 · 夜色签</button>
    <button class="modal-btn gacha-btn" data-pool="minglang">☀️ 明朗 · 晴空签</button>
    <button class="modal-btn gacha-btn" data-pool="xiaomo">❄️ 萧默 · 霜雪签</button>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-sm" id="gacha-back">返回</button>
    </div>
  </div>
</div>

<!-- ====== 来电界面 ====== -->
<div id="phone-overlay" class="overlay hidden">
  <div class="modal phone-modal">
    <div class="phone-ring-icon">📞</div>
    <div class="modal-title" id="phone-title">来电中……</div>
    <div class="phone-caller" id="phone-caller"></div>
    <div class="phone-transcript" id="phone-transcript"></div>
    <div class="phone-buttons">
      <button class="modal-btn phone-accept" id="phone-accept">📞 接听</button>
      <button class="modal-btn modal-btn-danger" id="phone-decline">✕ 挂断</button>
    </div>
    <div class="phone-progress" id="phone-progress" style="display:none">
      <div class="phone-progress-bar" id="phone-progress-bar"></div>
    </div>
  </div>
</div>

<!-- ====== CG画廊 ====== -->
<div id="gallery-overlay" class="overlay hidden">
  <div class="modal modal-wide">
    <div class="modal-title">🖼 CG画廊 <span id="gallery-count" style="font-size:12px;color:var(--text-dim)"></span></div>
    <div class="gallery-grid" id="gallery-grid"></div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-sm" id="gallery-back">返回</button>
    </div>
  </div>
</div>

<!-- ====== 经营管理面板 ====== -->
<div id="mgmt-overlay" class="overlay hidden">
  <div class="modal modal-wide mgmt-modal">
    <div class="modal-title">☕ 经营管理</div>
    <div class="mgmt-tabs">
      <button class="mgmt-tab active" data-tab="menu">📋 菜单</button>
      <button class="mgmt-tab" data-tab="ingredients">🛒 采购</button>
      <button class="mgmt-tab" data-tab="decor">🪑 装饰</button>
      <button class="mgmt-tab" data-tab="research">🔬 研发</button>
    </div>
    <div class="mgmt-content" id="mgmt-content"></div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-sm" id="mgmt-back">返回</button>
    </div>
  </div>
</div>

<!-- ====== 设备商店 ====== -->
<div id="shop-overlay" class="overlay hidden">
  <div class="modal modal-wide">
    <div class="modal-title">🛒 设备商店</div>
    <div id="shop-list"></div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-sm" id="shop-back">返回</button>
    </div>
  </div>
</div>

<script>
(function(){
  var ua = navigator.userAgent || '';
  var isWechat = /MicroMessenger/i.test(ua);
  var isQQ = /QQ\//i.test(ua) && !/MicroMessenger/i.test(ua);
  if (isWechat || isQQ) {
    document.getElementById('wechat-tip').style.display = 'block';
  }
})();
</script>
<script src="game.js"></script>
</body>
</html>
